# Reference site block for a host-level nginx: https://launchscout.dinesh-genai.tech -> 127.0.0.1:8612
# Add as a NEW file (e.g. /etc/nginx/sites-available/launchscout.dinesh-genai.tech); never edit other
# sites' blocks. Then: nginx -t && systemctl reload nginx, and issue HTTPS for this subdomain only:
#   certbot --nginx -d launchscout.dinesh-genai.tech
# If the VPS uses a different proxy (Caddy, Traefik, nginx in Docker), adapt these settings to it.

map $http_upgrade $launchscout_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name launchscout.dinesh-genai.tech;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8612;
        proxy_http_version 1.1;

        # Streamlit needs WebSockets, otherwise the page stays on "Connecting".
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $launchscout_connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Research runs take 1-3 minutes and the page holds a WebSocket open meanwhile.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_buffering off;
    }
}
