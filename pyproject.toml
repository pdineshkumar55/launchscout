[project]
name = "launchscout"
version = "0.1.0"
description = "Competitor research report for any business idea and city, with prices and sources"
requires-python = ">=3.10,<3.14"

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = [".venv", "outputs", ".cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # long prompt strings; formatter-style wrapping hurts prompt readability

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: end-to-end runs that call paid APIs (deselect with -m 'not live')"]
